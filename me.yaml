bio: |
  ### About
  I am a fourth-year PhD candidate in Economics at Stockholm University, advised by Roine Vestman. My research is in household finance and public economics, with a broader interest in how households respond to financial incentives, information, and institutional design.

  I use administrative and survey data together with applied microeconometric methods. In spring 2026, I was a visiting PhD student at Columbia Business School, hosted by Stephen Zeldes.
